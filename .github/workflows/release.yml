name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check and package
        shell: pwsh
        run: |
          npm run check
          ./scripts/package-windows.ps1
          if (!(Test-Path dist/BoidsWallpaper-win-x64/BoidsWallpaper.exe) -or !(Test-Path dist/BoidsWallpaper-win-x64/wallpaper/index.html)) { throw 'Incomplete release package' }
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: gh release create $env:RELEASE_TAG dist/BoidsWallpaper-win-x64.zip --generate-notes
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: BoidsWallpaper-win-x64
          path: dist/BoidsWallpaper-win-x64.zip
