<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="White triangle boids flocking on a black live wallpaper. The pointer steers them; clicks do nothing." />
    <title>Boids — live flocking wallpaper</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="wallpaper" aria-label="Boids live wallpaper">
      <canvas id="boids" role="img" aria-label="White triangles flocking across a black field">

      </canvas>
      <p id="error" role="alert" hidden></p>
    </main>
    <noscript>This live wallpaper requires JavaScript.</noscript>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
